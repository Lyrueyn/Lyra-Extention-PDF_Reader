<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>璃鸢镜 · PDF 阅读器</title>
  <link rel="stylesheet" href="reader.css">
</head>
<body>
  <header id="top">
    <div class="identity"><span class="brandMark" aria-hidden="true">PDF</span><div><strong>PDF 阅读器</strong><div id="fileName">未打开文件</div></div></div>
    <button class="btn primary" id="openBtn" title="打开 PDF · Ctrl+O">打开 PDF</button>
    <div class="toolbar" aria-label="阅读工具">
      <button class="btn" id="sidebarBtn" data-document disabled aria-expanded="true" title="显示或隐藏页面导航">导航</button>
      <button class="btn" id="searchBtn" data-document disabled title="全文查找 · Ctrl+F">查找</button>
      <div class="group" aria-label="页码跳转">
        <button class="btn icon" id="prevBtn" data-document disabled aria-label="上一页" title="上一页 · ←">‹</button>
        <input id="pageInput" value="1" inputmode="numeric" aria-label="当前页码" disabled autocomplete="off">
        <span id="pageTotal">/ 0</span>
        <button class="btn icon" id="nextBtn" data-document disabled aria-label="下一页" title="下一页 · →">›</button>
      </div>
      <select id="zoomMode" aria-label="缩放方式" data-document disabled>
        <option value="width">适应宽度</option><option value="page">整页显示</option><option value="custom" hidden>自定缩放</option>
      </select>
      <div class="group">
        <button class="btn icon" id="zoomOutBtn" data-document disabled aria-label="缩小">−</button>
        <output id="zoomValue" aria-label="缩放比例">100%</output>
        <button class="btn icon" id="zoomInBtn" data-document disabled aria-label="放大">＋</button>
      </div>
      <button class="btn" id="rotateBtn" data-document disabled title="顺时针旋转 90° · R">旋转</button>
      <button class="btn" id="nightBtn" aria-pressed="false">夜间</button>
    </div>
  </header>
  <form id="searchBar" hidden role="search">
    <input id="searchInput" type="search" placeholder="在文档中查找文字" aria-label="查找文字" autocomplete="off">
    <span id="searchCount" role="status" aria-live="polite">输入关键词</span>
    <button class="btn icon" type="button" id="searchPrev" aria-label="上一个匹配" disabled>↑</button>
    <button class="btn icon" type="submit" id="searchNext" aria-label="下一个匹配" disabled>↓</button>
    <button class="btn icon" type="button" id="searchClose" aria-label="关闭查找">×</button>
  </form>
  <main id="stage">
    <aside id="sidebar" aria-label="文档导航">
      <div class="tabs" role="tablist" aria-label="导航方式">
        <button id="thumbTab" role="tab" aria-selected="true" aria-controls="thumbs">页面</button>
        <button id="outlineTab" role="tab" aria-selected="false" aria-controls="outline" tabindex="-1">目录</button>
      </div>
      <div id="thumbs" role="tabpanel" aria-labelledby="thumbTab"><div id="thumbList"></div></div>
      <div id="outline" role="tabpanel" aria-labelledby="outlineTab" hidden><p class="muted">打开文档后显示目录</p></div>
    </aside>
    <div id="viewer" tabindex="0" aria-label="PDF 阅读区域"><div id="pages"></div></div>
    <div id="empty"><div class="card">
      <div class="emptyMark" aria-hidden="true">PDF</div><h1>把阅读留给内容</h1>
      <p>打开或拖入 PDF，开始阅读。</p><p class="hint">目录导航 · 文字复制 · 全文查找 · 连续阅读</p>
      <button class="btn primary big" id="emptyOpenBtn">选择 PDF 文件</button>
      <p class="hint">Ctrl+F 查找　·　Ctrl+滚轮缩放　·　← → 翻页</p>
    </div></div>
    <div id="dropHint">松开以打开 PDF</div>
    <div id="loading" hidden role="status"><div class="spinner"></div><span id="loadingText">正在加载…</span></div>
  </main>
  <footer><span id="status" role="status">准备就绪</span><span id="readingProgress"></span></footer>
  <dialog id="passwordDialog" aria-labelledby="passwordTitle">
    <form id="passwordForm"><h2 id="passwordTitle">此 PDF 需要密码</h2><p id="passwordHint">输入文档密码后继续阅读。</p>
      <input id="passwordInput" type="password" aria-label="文档密码" autocomplete="off" required>
      <div class="dialogActions"><button class="btn" type="button" id="passwordCancel">取消</button><button class="btn primary" type="submit">打开</button></div>
    </form>
  </dialog>
  <input type="file" id="fileInput" accept=".pdf,application/pdf" hidden>
  <script src="lib/pdf.min.js"></script>
  <script src="reader.js"></script>
</body>
</html>
